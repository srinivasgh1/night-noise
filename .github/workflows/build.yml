name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Unzip project if uploaded as a zip
        run: |
          if [ -f NightNoise.zip ]; then unzip -q -o NightNoise.zip -d src; echo "DIR=src/NightNoise" >> $GITHUB_ENV; else echo "DIR=." >> $GITHUB_ENV; fi
      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: NightNoise-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
